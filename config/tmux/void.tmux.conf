# VOID dashboard — tmux configuration (runs on its own server: tmux -L void-desktop).
# Your ~/.tmux.conf is never read by this server and never modified.
# Colours are appended from config/tmux/colors.conf (generated from tokens.toml).

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,konsole*:RGB,alacritty*:RGB,xterm-kitty:RGB"
set -g status off
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g set-titles off
set -g allow-rename off
set -g remain-on-exit off
set -g history-limit 2000
set -g pane-border-lines single
set -g pane-border-status off
setw -g aggressive-resize on

# prefix stays Ctrl+B. Extra keys:
#   prefix r   restart every pane            prefix m   jump to the music pane
#   prefix d   detach (the dashboard keeps running; `void launch` re-opens it)
bind r run-shell -b "VOID_BIN dashboard respawn"
bind m select-pane -t "{bottom}"
